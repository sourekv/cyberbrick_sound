<text x="130" y="450" font-size="13" text-anchor="middle">40 mm 4 &#937; speaker</text><text x="130" y="466" font-size="11" text-anchor="middle" fill="#555">solder lugs marked + and -</text>
<path d="M300 336 L205 336 L180 349" fill="none" stroke="#d22" stroke-width="3"/><path d="M300 386 L205 386 L180 374" fill="none" stroke="#222" stroke-width="3"/>
<rect x="30" y="560" width="26" height="6" fill="#d22"/><text x="64" y="567" font-size="13" fill="#222">5V  to  Vin</text>
<rect x="235" y="560" width="26" height="6" fill="#222"/><text x="269" y="567" font-size="13" fill="#222">GND  to  GND</text>
<rect x="440" y="560" width="26" height="6" fill="#8844aa"/><text x="474" y="567" font-size="13" fill="#222">GPIO4  to  DIN</text>
<rect x="645" y="560" width="26" height="6" fill="#2f8f4e"/><text x="679" y="567" font-size="13" fill="#222">GPIO5  to  BCLK</text>
<rect x="850" y="560" width="26" height="6" fill="#e07a1e"/><text x="884" y="567" font-size="13" fill="#222">GPIO6  to  LRC</text>
<text x="30" y="600" font-size="12" fill="#777">The amplifier is drawn with its pins on the right edge; on your breadboard the pin order reads LRC, BCLK, DIN, GAIN, SD, GND, Vin from the left.</text>
</svg>