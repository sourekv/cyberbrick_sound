<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="660" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1a1a1a">cyberbrick_sound: current wiring (one servo cable to S4, data and power)</text>
  <text x="30" y="64" font-size="13" fill="#555">State of 2026-11-12: configuration Truck_with_Engine_Sound_Data.json, firmware engine_lab, 1N5819 OR-ing diode in V.</text>

  <!-- battery and switch -->
  <rect x="30" y="100" width="120" height="44" rx="8" fill="#dbe9ff" stroke="#2b5fb4"/>
  <text x="90" y="119" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d3f7a">battery 7.4 V</text>
  <text x="90" y="135" font-size="10" text-anchor="middle" fill="#1d3f7a">model battery</text>
  <path d="M150 122 L190 122" stroke="#d22" stroke-width="3"/>
  <rect x="190" y="104" width="90" height="36" rx="6" fill="#fff" stroke="#333"/>
  <text x="235" y="127" font-size="12" text-anchor="middle">switch</text>
  <path d="M235 140 L235 170" stroke="#d22" stroke-width="3"/>

  <!-- CyberBrick receiver -->
  <rect x="30" y="170" width="300" height="330" rx="12" fill="#e8f0fb" stroke="#2b5fb4" stroke-width="2"/>
  <text x="180" y="198" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d3f7a">CyberBrick receiver</text>
  <text x="180" y="216" font-size="11" text-anchor="middle" fill="#1d3f7a">Remote Control Receiver Shield - XA003 XA004</text>
  <text x="180" y="232" font-size="11" text-anchor="middle" fill="#1d3f7a">runs our snippet uart_forward.py (in the config)</text>
  <rect x="50" y="248" width="260" height="50" rx="6" fill="#ffffff" stroke="#999"/>
  <text x="180" y="270" font-size="12" text-anchor="middle" fill="#333">M1 motor, S1 steering, LED2 lights</text>
  <text x="180" y="287" font-size="10" text-anchor="middle" fill="#888">the truck as before, untouched</text>
  <rect x="50" y="315" width="260" height="160" rx="6" fill="#ffffff" stroke="#2b5fb4" stroke-width="2"/>
  <text x="180" y="338" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d3f7a">Servo header PWM4 (S4)</text>
  <text x="180" y="355" font-size="11" text-anchor="middle" fill="#555">S: channel data, 115200 8N1, 3.3 V</text>
  <text x="180" y="370" font-size="11" text-anchor="middle" fill="#555">V: about 4.94 V   G: ground</text>
  <circle cx="110" cy="400" r="13" fill="#f5b942" stroke="#333"/><text x="110" y="404" font-size="12" text-anchor="middle" font-weight="bold">S</text>
  <circle cx="180" cy="400" r="13" fill="#e55" stroke="#333"/><text x="180" y="404" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">V</text>
  <circle cx="250" cy="400" r="13" fill="#444" stroke="#333"/><text x="250" y="404" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">G</text>

  <!-- wires from S4 -->
  <path d="M110 413 L110 540 L395 540 L395 520" fill="none" stroke="#e0a020" stroke-width="3"/>
  <path d="M395 498 L395 486 L362 486 L362 285 L380 285" fill="none" stroke="#e0a020" stroke-width="3"/>
  <circle cx="380" cy="285" r="4" fill="#e0a020" stroke="#8a5a00"/>
  <path d="M180 413 L180 575 L418 575" fill="none" stroke="#d22" stroke-width="3"/>
  <path d="M442 575 L470 575 L470 470" fill="none" stroke="#d22" stroke-width="3"/>
  <!-- OR-ing diode 1N5819: anode from the receiver, cathode (bar) to the Zero 5V -->
  <path d="M418 563 L418 587 L440 575 Z" fill="#333" stroke="#333" stroke-width="1"/>
  <path d="M441 562 L441 588" stroke="#333" stroke-width="3"/>
  <text x="430" y="597" font-size="10" text-anchor="middle" fill="#333">1N5819</text>
  <path d="M250 413 L250 610 L540 610 L540 470" fill="none" stroke="#333" stroke-width="3"/>
  <text x="262" y="534" font-size="12" fill="#8a5a00">S: data</text>
  <text x="262" y="569" font-size="12" fill="#b11">V: 5 V supply</text>
  <text x="262" y="604" font-size="12" fill="#333">G: ground</text>
  <!-- resistor -->
  <rect x="360" y="498" width="70" height="22" rx="4" fill="#d9b382" stroke="#333"/>
  <text x="395" y="514" font-size="12" text-anchor="middle">1 k&#937;</text>

  <!-- ESP32 -->
  <rect x="380" y="150" width="210" height="320" rx="10" fill="#e9f6ec" stroke="#2f8f4e" stroke-width="2"/>
  <text x="485" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d5e33">Waveshare ESP32-S3-Zero</text>
  <text x="485" y="198" font-size="11" text-anchor="middle" fill="#1d5e33">firmware engine_lab</text>
  <rect x="445" y="212" width="80" height="34" rx="4" fill="#cfe8d6" stroke="#2f8f4e"/><text x="485" y="234" font-size="12" text-anchor="middle">USB-C</text>
  <text x="398" y="290" font-size="12" fill="#333">GPIO1  data in (via 1 k&#937;)</text>
  <text x="398" y="330" font-size="12" fill="#333">GPIO4  I2S DIN</text>
  <text x="398" y="360" font-size="12" fill="#333">GPIO5  I2S BCLK</text>
  <text x="398" y="390" font-size="12" fill="#333">GPIO6  I2S LRC</text>
  <text x="398" y="420" font-size="12" fill="#333">5V  /  GND</text>
  <text x="398" y="450" font-size="10" fill="#555">GPIO21 status LED (onboard)</text>

  <!-- USB -->
  <rect x="620" y="110" width="210" height="58" rx="8" fill="#f3f3f3" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="725" y="133" font-size="13" text-anchor="middle">USB: flashing and serial</text>
  <text x="725" y="152" font-size="10" text-anchor="middle" fill="#1d5e33">may stay with the receiver on (1N5819 in V)</text>
  <path d="M620 140 L525 225" fill="none" stroke="#bbb" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- I2S and power wires to the amplifier -->
  <path d="M590 330 L700 330" stroke="#8844aa" stroke-width="3" fill="none"/>
  <path d="M590 360 L740 360" stroke="#2f8f4e" stroke-width="3" fill="none"/>
  <path d="M590 390 L780 390" stroke="#c4571e" stroke-width="3" fill="none"/>
  <path d="M590 420 L820 420" stroke="#d22" stroke-width="3" fill="none"/>

  <!-- amplifier -->
  <rect x="660" y="260" width="240" height="220" rx="10" fill="#f3e9fa" stroke="#7a3fa0" stroke-width="2"/>
  <text x="780" y="290" font-size="16" font-weight="bold" text-anchor="middle" fill="#55207a">MAX98357A module</text>
  <text x="680" y="324" font-size="12" fill="#333">DIN</text>
  <text x="680" y="354" font-size="12" fill="#333">BCLK</text>
  <text x="680" y="384" font-size="12" fill="#333">LRC</text>
  <text x="680" y="414" font-size="12" fill="#333">Vin / GND</text>
  <text x="680" y="454" font-size="10" fill="#555">SD, GAIN: open</text>
  <rect x="850" y="425" width="50" height="40" rx="3" fill="#7bc17e" stroke="#333"/>
  <text x="875" y="449" font-size="9" text-anchor="middle">screw</text><text x="875" y="460" font-size="9" text-anchor="middle">terminal</text>

  <!-- speaker in the box -->
  <rect x="945" y="400" width="130" height="150" rx="14" fill="#eef2f6" stroke="#555" stroke-width="2"/>
  <circle cx="1010" cy="470" r="48" fill="#f5f5f5" stroke="#333" stroke-width="3"/>
  <circle cx="1010" cy="470" r="18" fill="#ddd" stroke="#333"/>
  <text x="1010" y="570" font-size="12" text-anchor="middle">40 mm 4 &#937; speaker</text>
  <text x="1010" y="586" font-size="12" text-anchor="middle">in the 30 ml sealed box</text>
  <path d="M900 435 L962 450" stroke="#d22" stroke-width="3" fill="none"/>
  <path d="M900 455 L962 485" stroke="#333" stroke-width="3" fill="none"/>

  <!-- notes -->
  <text x="620" y="215" font-size="11" fill="#333">Measured: 57 mA idle, 105 mA at full throttle</text>
  <text x="620" y="231" font-size="11" fill="#333">(MASTER_VOLUME 0.6, 40 mm speaker)</text>
  <text x="30" y="650" font-size="12" fill="#777">Without the 1N5819, never connect USB and the receiver's V at the same time. GND first on, last off. Never put 7.4 V on any board pin.</text>
</svg>
