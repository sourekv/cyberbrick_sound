; Three firmware variants, one environment each:
;   pio run -e test_tone     -t upload   (I2S sine tone, checks amplifier wiring)
;   pio run -e pulse_measure -t upload   (prints throttle pulse width to serial)
;   pio run -e engine        -t upload   (engine sound driven by throttle, pitch-shifted loop)
;   pio run -e engine_pulse  -t upload   (engine sound from synthesised combustion grains)
;   pio run -e engine_diesel -t upload   (like engine, but with a real diesel idle loop, CC0; playback rate 1.0x..3.0x)
;   pio run -e engine_real   -t upload   (start-up + idle loop from a real recording; needs include/user_sounds.h,
;                                         generated locally with tools/make_user_sounds.py, not in git)
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:test_tone]
build_src_filter = +<test_tone/>

[env:pulse_measure]
build_src_filter = +<pulse_measure/>

[env:engine]
build_src_filter = +<engine/>

[env:engine_diesel]
build_src_filter = +<engine/>
build_flags =
    ${env.build_flags}
    -DENGINE_DIESEL

[env:engine_pulse]
build_src_filter = +<engine_pulse/>

[env:engine_real]
build_src_filter = +<engine_real/>
