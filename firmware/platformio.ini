; Three firmware variants, one environment each:
;   pio run -e test_tone     -t upload   (I2S sine tone, checks amplifier wiring)
;   pio run -e pulse_measure -t upload   (prints throttle pulse width to serial)
;   pio run -e uart_probe    -t upload   (prints the channel frames sent by the receiver Code snippet docs/cyberbrick-code/uart_forward.py)
;   pio run -e speaker_sweep -t upload   (slow sine sweep through the speaker, for measuring its response; docs/speaker-measurement.md)
;   pio run -e engine        -t upload   (engine sound driven by throttle, pitch-shifted loop)
;   pio run -e engine_pulse  -t upload   (engine sound from synthesised combustion grains)
;   pio run -e engine_diesel -t upload   (like engine, but with a real diesel idle loop, CC0; playback rate 1.0x..3.0x, virtual gearbox)
;   pio run -e engine_truck  -t upload   (same with a real truck idle loop, CC0; playback rate 1.0x..3.0x, virtual gearbox;
;                                         switch the gearbox off with -DGEARBOX_ENABLED=0 or GEARBOX_ENABLED in config.h)
;   pio run -e engine_gears  -t upload   (a separate sample for each of the 5 gears of the virtual gearbox, CC0 truck loops;
;                                         every gear change is announced with 1..5 beeps, test aid: -DGEAR_BEEP=0 switches it off)
;   pio run -e engine_lab    -t upload   (all engine-sound candidates, the BOOT button switches 1..6 and beeps the number)
;   pio run -e engine_demo   -t upload   (the same, announces and plays every sound through the whole rpm range by itself)
;   pio run -e engine_real   -t upload   (start-up + idle loop from a real recording; needs include/user_sounds.h,
;                                         generated locally with tools/make_user_sounds.py, not in git)
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:test_tone]
build_src_filter = +<test_tone/>

[env:speaker_sweep]
build_src_filter = +<speaker_sweep/>

[env:pulse_measure]
build_src_filter = +<pulse_measure/>

[env:uart_probe]
build_src_filter = +<uart_probe/>

[env:engine]
build_src_filter = +<engine/>
build_flags =
    ${env.build_flags}
    -DGEARBOX_ENABLED=0

[env:engine_diesel]
build_src_filter = +<engine/>
build_flags =
    ${env.build_flags}
    -DENGINE_DIESEL

[env:engine_truck]
build_src_filter = +<engine/>
build_flags =
    ${env.build_flags}
    -DENGINE_TRUCK

[env:engine_gears]
build_src_filter = +<engine_gears/>
; room for more loops: 3.3 MB app slots (default_8MB.csv) instead of the 1.3 MB of the default partition table
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DGEAR_BEEP=1

; all engine-sound candidates in one firmware, BOOT button switches 1..6 (beeps the number); see docs/sound-research.md
[env:engine_lab]
build_src_filter = +<engine_lab/>
board_build.partitions = default_8MB.csv

; the same, but plays all sounds in turn with a scripted throttle (no receiver needed), BOOT skips
[env:engine_demo]
build_src_filter = +<engine_lab/>
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DENGINE_LAB_DEMO=1

[env:engine_pulse]
build_src_filter = +<engine_pulse/>

[env:engine_real]
build_src_filter = +<engine_real/>
